name: Update Sports Streams

on:
  schedule:
     - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output folder
        run: mkdir -p output

      - name: Run extractor
        run: python scripts/extractor.py

      - name: Show output files
        run: |
          echo "=== Output folder ==="
          ls -lh output/ || echo "output folder is empty"
          if [ -f "output/streams.m3u" ]; then
            COUNT=$(grep -c "#EXTINF" output/streams.m3u || true)
            echo "STREAM_COUNT=$COUNT" >> $GITHUB_ENV
          else
            echo "STREAM_COUNT=0" >> $GITHUB_ENV
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"

          # Add entire output folder — no individual file errors
          git add output/ || true
          git add README.md || true

          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "🔄 Auto-update: ${{ env.STREAM_COUNT }} streams [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streams-${{ github.run_number }}
          path: output/
          retention-days: 3
