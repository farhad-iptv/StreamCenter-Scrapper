name: Update Sports Streams

# ────────────────────────────────────────────────
# When to run this workflow
# ────────────────────────────────────────────────
on:
  # Run automatically every 30 minutes
  schedule:
    - cron: '*/30 * * * *'    # every 30 min
    # - cron: '0 * * * *'     # every 1 hour (use this if 30min is too frequent)
    # - cron: '*/15 * * * *'  # every 15 min

  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

# ────────────────────────────────────────────────
# Jobs
# ────────────────────────────────────────────────
jobs:
  update-streams:
    runs-on: ubuntu-latest        # use latest Ubuntu runner
    
    # Give write permission to push files back to repo
    permissions:
      contents: write

    steps:
      # ── Step 1: Download your repo code ──
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Install Python ──
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Step 3: Install dependencies ──
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Run your script ──
      - name: Run Stream Extractor
        run: |
          python fetch_streams.py
        env:
          PYTHONUNBUFFERED: "1"     # show print() output in real time

      # ── Step 5: Commit and push updated files ──
      - name: Commit and Push Updated Files
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add streams/
          
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes detected — skipping commit"
          else
            git commit -m "🔄 Auto-update streams $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
